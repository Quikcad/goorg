name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep the toolchain pinned to one place; the matrix below overrides it.
  GO_VERSION: "1.25.x"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: arduino/setup-task@v3
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: gofmt
        run: task fmt:check

      - name: go vet
        run: task vet

      - name: go.mod is tidy
        run: task tidy:check

  test:
    name: Test (go ${{ matrix.go }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # goorg reads paths and file names, so Windows and macOS are not
        # cosmetic coverage — path separators and case sensitivity differ.
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Test
        run: go test -race -shuffle=on ./...

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test with coverage
        run: go test -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Report
        run: go tool cover -func=coverage.txt | tail -1

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.txt
          retention-days: 7

  dogfood:
    name: Dogfood
    runs-on: ubuntu-latest
    # goorg must pass its own rules. A rule this project cannot live under is a
    # rule that needs rethinking, so this job is not allowed to be advisory.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: go build -o bin/goorg ./cmd/lint/goorg

      - name: Check goorg with goorg
        run: ./bin/goorg check --format=github ./...

  release-config:
    name: Release config
    runs-on: ubuntu-latest
    # The release path is exercised once a year and breaks silently in between.
    # It pointed at ./cmd/goorg for four phases after that package moved.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: The build target in .goreleaser.yaml exists
        run: |
          set -euo pipefail
          target=$(grep -oP '^\s*main:\s*\K\S+' .goreleaser.yaml)
          echo "goreleaser builds $target"
          go build -o /dev/null "$target"

      - name: The action downloads what goreleaser publishes
        run: |
          set -euo pipefail
          # goreleaser names archives <project>_<version>_<os>_<arch>.<ext>;
          # action.yml reconstructs that name to fetch one. If either side
          # changes its template alone, every release becomes uninstallable.
          grep -q 'name_template: >-' .goreleaser.yaml
          grep -q '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}' .goreleaser.yaml
          grep -q 'asset="goorg_${bare}_${os}_${arch}.${ext}"' action.yml

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify every release target compiles
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            echo "==> $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/lint/goorg
          done
