# goorg's own configuration. goorg checks itself in CI (`task dogfood`).
#
# A rule this project cannot live under is a rule that needs rethinking, so this
# file stays close to the shipped defaults. Every deviation carries its reason.
version: 1

rules:
  # directory organization — where code lives
  dir/domain-layout: error
  dir/domain-has-no-go-files: error
  dir/embedded-assets: error
  dir/max-entries: error
  dir/max-package-depth: error
  dir/top-level-layout: error

  # file organization — how code is split across files
  org/globals-singleton-only: error
  org/interface-own-file: error
  org/max-functions-per-file: error
  org/max-private-functions: error
  org/max-public-functions: error
  org/member-order: error
  org/private-functions-last: error
  org/singleton-instance-func: error
  org/singleton-layout: error
  org/type-cohesion: error

  # logic organization — how code is shaped
  logic/iota-candidate: error
  logic/max-condition-operands: error
  logic/max-object-members: error
  logic/prefer-guard-clause: error

  # pattern correctness — naming and declaration layout
  pat/expand-struct-definition: error
  pat/factory-naming: error

  # type tier — these need the module to compile; --syntax-only skips them
  logic/any-should-be-generic: warning
  logic/ideal-numeric-type: warning
  logic/interface-registry: error
  org/consumer-locality: warning
  org/global-file-scoped: error
  # rules approved in D7
  logic/boolean-field-count: warning
  logic/boolean-parameter: warning
  logic/constraint-too-wide: warning
  logic/context-in-struct: error
  logic/duplicate-const-value: error
  logic/empty-branch: warning
  logic/empty-interface-field: warning
  logic/enum-missing-string: warning
  logic/enum-zero-value-unnamed: warning
  logic/exported-embedded-mutex: error
  logic/float-equality: error
  logic/identical-branches: error
  logic/if-chain-to-switch: warning
  logic/integer-division-to-float: error
  logic/interface-at-consumer: warning
  logic/interface-size: warning
  logic/lossy-conversion: error
  logic/max-function-lines: warning
  logic/max-function-params: warning
  logic/max-nesting-depth: error
  logic/max-return-values: warning
  logic/negated-condition: warning
  logic/panic-outside-main: error
  logic/pointer-to-slice-or-map: warning
  logic/single-case-switch: warning
  logic/stringly-typed-enum: warning
  logic/unsigned-underflow: warning
  logic/unused-type-parameter: warning

settings:
  dir/domain-layout:
    # Domains in both roots, so goorg dogfoods its own strictest layout rule
    # rather than leaving that path to fixtures alone. See docs/decisions.md D2.
    pkg: domains
    cmd: domains
    # internal/ holds the CLI and the version stamp — application code with no
    # importers, where a domain layer would be ceremony.
    internal: any

  dir/max-package-depth:
    pkg: 2
    cmd: 2
    internal: 1

  dir/max-entries:
    # 20 is the shipped default, calibrated at roughly the standard library's
    # p90. See docs/decisions.md D5.
    limit: 20

  org/max-functions-per-file:
    limit: 15
    # Must stay false, or a type with more methods than this cannot satisfy
    # both this rule and org/type-cohesion. See docs/file-organization.md.
    count_methods: false

  org/max-public-functions:
    limit: 6

  org/max-private-functions:
    limit: 5
    when_file_has_exports: true

  logic/max-object-members:
    fields: 12
    methods: 15

  logic/max-condition-operands:
    max: 4
    require_parens_on_mixed: true

  pat/factory-naming:
    # `all-factories` would flag Parse, Open, Dial and MustCompile — all
    # correct Go. See docs/logic-organization.md.
    scope: prefixed

exclude:
  # "**/testdata/**" is excluded automatically and is not repeated here.
  - "bin/**"
  - "dist/**"
